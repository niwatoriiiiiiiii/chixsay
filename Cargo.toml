[package]
name = "chixsay"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.1"
description = "cowsay, but for chickens."
license = "MIT OR Apache-2.0"
repository = "https://github.com/niwatoriiiiiiiii/chixsay"
readme = "README.md"

categories = ["command-line-utilities"]
keywords = ["cli", "terminal", "cowsay", "chicken", "ascii-art"]

include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE-*"]

[[bin]]
name = "chixsay"
path = "src/main.rs"

[dependencies]
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
pedantic = "warn"
nursery = "warn"
